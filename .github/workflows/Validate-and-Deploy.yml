name: Validate & Deploy Jekyll Docs

on:
  push:
    branches:
      - Deploy
    paths:
      - "docs/**"
      - ".github/workflows/**"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:

  # -------------------------
  # 1. Validate Jekyll Docs
  # -------------------------
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
          working-directory: docs

      - name: Install dependencies
        working-directory: docs
        run: bundle install

      - name: Validate Jekyll build (front matter + Liquid)
        working-directory: docs
        run: bundle exec jekyll build --strict_front_matter

      - name: Install HTML validator
        run: |
          sudo apt-get update
          sudo apt-get install -y tidy

      - name: Validate HTML output
        run: |
          shopt -s globstar nullglob
          for file in docs/_site/**/*.html; do
            echo "Checking $file"
            tidy -qe "$file" || true
          done

      - name: Install link checker
        run: sudo apt-get install -y linkchecker

      - name: Check for broken internal links
        run: |
          linkchecker docs/_site --ignore-url=^mailto:


  # -------------------------
  # 2. Build & Deploy (only if validate succeeds)
  # -------------------------
  deploy:
    needs: validate
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Install Dependencies
        run: |
          cd docs
          bundle install

      - name: Build Site
        run: |
          cd docs
          bundle exec jekyll build

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs/_site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
