name: Documentation Preview

on:
  pull_request:
    paths:
      - "docs/**"
      - ".github/workflows/**"

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: "docs-preview-${{ github.ref }}"
  cancel-in-progress: true

jobs:

  preview:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # -------------------------
      # Ruby + Bundler cache
      # -------------------------
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
          working-directory: docs

      - name: Install dependencies
        working-directory: docs
        run: bundle install

      # -------------------------
      # Build Jekyll site
      # -------------------------
      - name: Build site
        working-directory: docs
        run: bundle exec jekyll build

      # -------------------------
      # Upload preview artifact
      # -------------------------
      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-preview
          path: docs/_site
          retention-days: 7

      # -------------------------
      # Comment on PR with preview link
      # -------------------------
      - name: Comment with preview link
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          recreate: true
          message: |
            📄 **Documentation Preview Ready**

            A preview of the updated documentation is available:

            👉 **Download the built site artifact:**  
            _See the “Artifacts” section of this workflow run._

            This lets you inspect the rendered docs without merging the PR.
