name: Repository Tests

on:
  push:
    paths:
      - ".github/workflows/repository-tests.yml"
      - ".github/workflows/rollback.yml"
      - "test/**"
  pull_request:
    paths:
      - ".github/workflows/repository-tests.yml"
      - ".github/workflows/rollback.yml"
      - "test/**"

jobs:
  repository-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Run repository integrity tests
        run: ruby -Itest test/repository_integrity_test.rb
