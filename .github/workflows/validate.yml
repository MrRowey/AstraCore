name: Validate Docker Compose Files

on:
  push:
    paths:
      - 'nodes/**'
      - 'configs/**'

  pull_request:
    paths:
      - 'nodes/**'
      - 'configs/**'

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Docker Compose plugin
        run: |
          sudo apt-get update
          sudo apt-get install -y docker.io
          sudo apt-get install -y docker-compose-plugin

      - name: Ensure compose files exist
        run: |
          count=$(ls nodes/*/docker-compose.yml 2>/dev/null | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "❌ No docker-compose.yml files found in nodes/*/"
            exit 1
          fi
          echo "Found $count compose file(s)."

      - name: Validate all compose files
        run: |
          shopt -s nullglob
          for file in nodes/*/docker-compose.yml; do
            echo "🔍 Validating $file..."
            docker compose -f "$file" config -q
            echo "✅ $file is valid"
          done
