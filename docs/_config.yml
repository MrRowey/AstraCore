title: AstraCore
email: rowey.lab@gmail.com
description: >-
  Proxmox-based homelab cluster focused on virtualization, Docker workloads, and distributed systems.

# GitHub Pages base URL
baseurl: "/AstraCore"
url: "https://mrrowey.github.io"

github_repo: "https://github.com/MrRowey/AstraCore"

markdown: kramdown
permalink: pretty

theme: null

sass:
  style: compressed

collections:
  nodes:
    output: true
    permalink: /nodes/:name/

defaults:
  - scope:
      path: ""
      type: "nodes"
    values:
      layout: node
