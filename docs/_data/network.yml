nodes:
  - id: pve-net
    name: Heimdall
    role: Network
    services:
      - adguard
      - traefik
      - cloudflare_tunnel
      - wireguard
      - authelia

  - id: pve-backup
    name: Memory Core
    role: Proxmox Backup Server
    services:
      - proxmox_backup

  - id: pve-home
    name: Jarvis
    role: Home Automation
    services:
      - home_assistant
      - tapo
      - alexa
      - govee

  - id: pve-media
    name: Apollo
    role: Media Streaming
    services:
      - plex
      - sonarr
      - radarr
      - prowlarr
      - overseerr

  - id: pve-photos
    name: Photon Core
    role: Photo Management
    services:
      - immich

  - id: pve-monitor
    name: The Watchtower
    role: Monitoring and DevOps
    services:
      - portainer
      - grafana
      - prometheus
      - uptime_kuma
      - gitea

  - id: pve-web
    name: The Workshop
    role: Web Applications
    services:
      - rewards_app
      - childrens_library
      - postgres

  - id: pve-dl
    name: The Pirate Cove
    role: Automated Downloading
    services:
      - qbittorrent
      - recyclarr

  - id: pve-ai
    name: Friday
    role: Local AI Model
    services:
      - ollama
      - open_webui

services:
  adguard:
    label: AdGuard Home
    depends_on: []

  traefik:
    label: Traefik
    depends_on: []

  cloudflare_tunnel:
    label: Cloudflare Tunnel
    depends_on:
      - traefik

  wireguard:
    label: WireGuard
    depends_on: []

  authelia:
    label: Authelia
    depends_on:
      - traefik

  proxmox_backup:
    label: Proxmox Backup Server
    depends_on: []

  home_assistant:
    label: Home Assistant OS
    depends_on: []

  tapo:
    label: TP-Link Tapo Integration
    depends_on:
      - home_assistant

  alexa:
    label: Amazon Alexa Integration
    depends_on:
      - home_assistant

  govee:
    label: Govee Integration
    depends_on:
      - home_assistant

  plex:
    label: Plex
    depends_on: []

  sonarr:
    label: Sonarr
    depends_on:
      - prowlarr

  radarr:
    label: Radarr
    depends_on:
      - prowlarr

  prowlarr:
    label: Prowlarr
    depends_on: []

  overseerr:
    label: Overseerr
    depends_on:
      - plex

  immich:
    label: Immich
    depends_on: []

  portainer:
    label: Portainer
    depends_on: []

  grafana:
    label: Grafana
    depends_on:
      - prometheus

  prometheus:
    label: Prometheus
    depends_on: []

  uptime_kuma:
    label: Uptime Kuma
    depends_on: []

  gitea:
    label: Gitea
    depends_on: []

  rewards_app:
    label: Rewards App
    depends_on:
      - postgres

  childrens_library:
    label: Childrens Library
    depends_on:
      - postgres

  postgres:
    label: Postgres
    depends_on: []

  qbittorrent:
    label: qBittorrent
    depends_on: []

  recyclarr:
    label: Recyclarr
    depends_on:
      - sonarr
      - radarr

  ollama:
    label: Ollama
    depends_on: []

  open_webui:
    label: Open WebUI
    depends_on:
      - ollama
