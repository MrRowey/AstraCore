# =============================================================================
# AstraCore Master Data Registry: Unified Infrastructure Telemetry Map
# Merges physical node allocations with logical service dependency states
# =============================================================================

nodes:
  - id: "node-1"
    name: "Heimdall"
    role: "Network & Security"
    network:
      vm: "pve-net"
    services:
      - "adguard"
      - "traefik"
      - "cloudflare_tunnel"
      - "wireguard"
      - "authelia"

  - id: "node-2"
    name: "Memory Core"
    role: "Proxmox Backup Server"
    network:
      vm: "pve-backup"
    services:
      - "proxmox_backup"

  - id: "node-3"
    name: "Jarvis"
    role: "Home Automation"
    network:
      vm: "pve-home"
    services:
      - "home_assistant"
      - "tapo"
      - "alexa"
      - "govee"

  - id: "node-4"
    name: "Apollo"
    role: "Media Streaming"
    network:
      vm: "pve-media"
    services:
      - "plex"
      - "sonarr"
      - "radarr"
      - "prowlarr"
      - "overseerr"

  - id: "node-5"
    name: "Photon Core"
    role: "Photo Management"
    network:
      vm: "pve-photos"
    services:
      - "immich"

  - id: "node-6"
    name: "The Watchtower"
    role: "Monitoring and DevOps"
    network:
      vm: "pve-monitor"
    services:
      - "portainer"
      - "grafana"
      - "prometheus"
      - "uptime_kuma"
      - "gitea"

  - id: "node-7"
    name: "The Workshop"
    role: "Web Applications"
    network:
      vm: "pve-web"
    services:
      - "rewards_app"
      - "childrens_library"
      - "postgres"

  - id: "node-8"
    name: "The Pirate Cove"
    role: "Automated Downloading"
    network:
      vm: "pve-dl"
    services:
      - "qbittorrent"
      - "recyclarr"

  - id: "node-9"
    name: "Friday"
    role: "Local AI Model"
    network:
      vm: "pve-ai"
    services:
      - "ollama"
      - "open_webui"

# =============================================================================
# Logical Service Registry & Cross-Node Microservice Dependency Trees
# =============================================================================
services:
  adguard:
    label: "AdGuard Home"
    depends_on: []

  traefik:
    label: "Traefik"
    depends_on: []

  cloudflare_tunnel:
    label: "Cloudflare Tunnel"
    depends_on:
      - "traefik"

  wireguard:
    label: "WireGuard"
    depends_on: []

  authelia:
    label: "Authelia"
    depends_on:
      - "traefik"

  proxmox_backup:
    label: "Proxmox Backup Server"
    depends_on: []

  home_assistant:
    label: "Home Assistant OS"
    depends_on: []

  tapo:
    label: "TP-Link Tapo Integration"
    depends_on:
      - "home_assistant"

  alexa:
    label: "Amazon Alexa Integration"
    depends_on:
      - "home_assistant"

  govee:
    label: "Govee Integration"
    depends_on:
      - "home_assistant"

  plex:
    label: "Plex"
    depends_on: []

  sonarr:
    label: "Sonarr"
    depends_on:
      - "prowlarr"

  radarr:
    label: "Radarr"
    depends_on:
      - "prowlarr"

  prowlarr:
    label: "Prowlarr"
    depends_on: []

  overseerr:
    label: "Overseerr"
    depends_on:
      - "plex"

  immich:
    label: "Immich"
    depends_on: []

  portainer:
    label: "Portainer"
    depends_on: []

  grafana:
    label: "Grafana"
    depends_on:
      - "prometheus"

  prometheus:
    label: "Prometheus"
    depends_on: []

  uptime_kuma:
    label: "Uptime Kuma"
    depends_on: []

  gitea:
    label: "Gitea"
    depends_on: []

  rewards_app:
    label: "Rewards App"
    depends_on:
      - "postgres"

  childrens_library:
    label: "Childrens Library"
    depends_on:
      - "postgres"

  postgres:
    label: "Postgres"
    depends_on: []

  qbittorrent:
    label: "qBittorrent"
    depends_on: []

  recyclarr:
    label: "Recyclarr"
    depends_on:
      - "sonarr"
      - "radarr"

  ollama:
    label: "Ollama"
    depends_on: []

  open_webui:
    label: "Open WebUI"
    depends_on:
      - "ollama"