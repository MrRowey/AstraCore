<section class="dashboard-section">

    <div class="dashboard-header">
        <h2>Infrastructure Overview</h2>
        <p>Live view of all AstraCore nodes</p>
    </div>

    <div class="dashboard-grid">

        {% for node in site.data.nodes %}

            <a class="dashboard-node-card" href="{{ '/nodes/' | append: node.id | append: '/' | relative_url }}">

                <div class="node-card-top">
                    <h3>{{ node.name }}</h3>

                    <span class="status-pill {{ node.status | downcase }}">
                        {{ node.status }}
                    </span>
                </div>

                <div class="node-card-meta">
                    <div>🖥 {{ node.network.vm }}</div>
                    <div>🌐 {{ node.network.ip }}</div>
                </div>

                <div class="node-card-role">
                    {{ node.role | join: ", " }}
                </div>

            </a>

        {% endfor %}

    </div>

</section>
