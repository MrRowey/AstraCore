<a href="{{ '/nodes/' | relative_url }}{{ node.id }}/" class="node-card">

  <div class="node-card-top">
    <div class="node-card-title">
      <h2>{{ node.name }}</h2>
      <h3>{{ node.vm }}</h3>
    </div>

    <span class="status-badge {{ node.status | downcase }}">
      {{ node.status }}
    </span>
  </div>

  <p class="node-role">{{ node.role }}</p>

</a>
