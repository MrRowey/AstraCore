<a href="/AstraCore/nodes/{{ node.id }}/" class="node-card">
  <div class="node-card-top">
    <h2>{{ node.name }}</h2>
    <h3>{{ node.vm }}</h3>

    <span class="status-badge {{ node.status | downcase }}">
      {{ node.status }}
    </span>
  </div>

  <p class="node-role">{{ node.role }}</p>

  <p class="node-description">
    CPU: {{ node.cpu }}<br>
    RAM: {{ node.ram }}<br>
    Storage: {{ node.storage }}<br>
    IP: {{ node.ip-address }}
  </p>
</a>
