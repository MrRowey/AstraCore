<div class="node-header">
    <div>
        <h1>{{ node.name }}</h1>

        {% if node.role %}
            <p class="node-role">
                {% for r in node.role %}
                    {{ r }}{% unless forloop.last %}, {% endunless %}
                {% endfor %}
            </p>
        {% endif %}
    </div>

    <span class="status-badge {{ node.status | downcase }}">
        {{ node.status }}
    </span>
</div>
