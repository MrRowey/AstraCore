<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% if page.title %}
            {{ page.title }} | {{ site.title }}
        {% elsif page.name %}
            {{ page.name }} | {{ site.title }}
        {% else %}
            {{ site.title }}
        {% endif %}
    </title>

    <meta name="description" content="{{ page.description | default: site.description }}">
    <meta name="keywords" content="{{ page.keywords | join: ', ' }}">

    <meta property="og:title" content="{{ page.title | default: page.name }} | {{ site.title }}">
    <meta property="og:description" content="{{ page.description | default: site.description }}">
    <meta property="og:url" content="{{ site.url }}{{ page.url }}">
    <meta property="og:type" content="website">
    <meta property="og:image" content="{{ site.url }}/assets/og-image.png">

    <meta name="twitter:card" content="summary_large_image">

    <link rel="canonical" href="{{ site.url }}{{ page.url }}">
    <link rel="icon" href="{{ '/assets/favicon.png' | relative_url }}">

    <link rel="preload" href="{{ '/assets/style.css' | relative_url }}" as="style">
    <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>

<body>

    <div class="grid-overlay"></div>

    {% include navbar.html %}

    <main class="main-content container" role="main">
        {{ content }}
    </main>

    {% include footer.html %}

</body>
</html>
