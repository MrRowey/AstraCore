version: "3.8"

services:
  adguard:
    image: adguard/adguardhome:latest
    container_name: adguard
    restart: unless-stopped
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "3000:3000"
    volumes:
      - /opt/appdata/adguard/conf:/opt/adguardhome/conf
      - /opt/appdata/adguard/work:/opt/adguardhome/work
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.adguard.rule=Host(`adguard.astracore.me`)"
      - "traefik.http.routers.adguard.entrypoints=websecure"
      - "traefik.http.services.adguard.loadbalancer.server.port=3000"
      - "traefik.http.routers.adguard.middlewares=authelia@docker"

  traefik:
    image: traefik:v3.1
    container_name: traefik
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /opt/appdata/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - /opt/appdata/traefik/acme:/etc/traefik/acme
      - /opt/appdata/traefik/dynamic:/etc/traefik/dynamic:ro
    environment:
      - CF_API_EMAIL=${CF_API_EMAIL}
      - CF_API_KEY=${CF_API_KEY}
    networks:
      - proxy

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CF_TUNNEL_TOKEN}
    networks:
      - proxy

  wireguard:
    image: lscr.io/linuxserver/wireguard:latest
    container_name: wireguard
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    ports:
      - "51820:51820/udp"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
      - SERVERURL=astracore.me
      - SERVERPORT=51820
      - PEERS=3
      - PEERDNS=auto
      - INTERNAL_SUBNET=10.13.13.0
    volumes:
      - /opt/appdata/wireguard:/config
      - /lib/modules:/lib/modules:ro
    networks:
      - proxy

  authelia:
    image: authelia/authelia:4.38.8
    container_name: authelia
    restart: unless-stopped
    volumes:
      - /opt/appdata/authelia:/config
    networks:
      - proxy

  authelia-db:
    image: postgres:15.6
    container_name: authelia-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=authelia
      - POSTGRES_USER=authelia
      - POSTGRES_PASSWORD=${AUTHELIA_DB_PASSWORD}
    volumes:
      - /opt/appdata/authelia/db:/var/lib/postgresql/data
    networks:
      - proxy

  redis:
    image: redis:7.2
    container_name: authelia-redis
    restart: unless-stopped
    networks:
      - proxy

  node-exporter:
    <<: *node_exporter

  portainer-agent:
    <<: *portainer_agent

networks:
  proxy:
    external: true
