version: "3.8"

services:
  immich-server:
    image: ghcr.io/immich-app/immich-server:v1.105.1
    container_name: immich-server
    restart: unless-stopped
    depends_on:
      - immich-db
      - immich-redis
    environment:
      - DB_HOST=immich-db
      - DB_PORT=5432
      - DB_USERNAME=immich
      - DB_PASSWORD=${IMMICH_DB_PASSWORD}
      - DB_DATABASE_NAME=immich
      - REDIS_HOST=immich-redis
      - UPLOAD_LOCATION=/usr/src/app/upload
    volumes:
      - /opt/appdata/immich/photos:/usr/src/app/upload
      - /opt/appdata/immich/config:/config
    ports:
      - "2283:2283"
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.immich.rule=Host(`immich.astracore.me`)"
      - "traefik.http.routers.immich.entrypoints=websecure"
      - "traefik.http.services.immich.loadbalancer.server.port=2283"
      - "traefik.http.routers.immich.middlewares=authelia@docker"

  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:v1.105.1
    container_name: immich-ml
    restart: unless-stopped
    environment:
      - TZ=${TZ}
    volumes:
      - /opt/appdata/immich/ml:/cache
    networks:
      - proxy

  immich-db:
    image: postgres:15.6
    container_name: immich-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=immich
      - POSTGRES_USER=immich
      - POSTGRES_PASSWORD=${IMMICH_DB_PASSWORD}
    volumes:
      - /opt/appdata/immich/db:/var/lib/postgresql/data
    networks:
      - proxy

  immich-redis:
    image: redis:7.2
    container_name: immich-redis
    restart: unless-stopped
    networks:
      - proxy

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - proxy

  portainer-agent:
    image: portainer/agent:latest
    container_name: portainer-agent
    restart: unless-stopped
    ports:
      - "9001:9001"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes
    networks:
      - proxy

networks:
  proxy:
    external: true
